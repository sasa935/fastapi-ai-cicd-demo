name: AI diagnose CI failure

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  diagnose:
    name: Diagnose & comment
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Fetch failed-step logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view ${{ github.event.workflow_run.id }} \
            --repo ${{ github.repository }} \
            --log-failed > failed.log || true
          wc -c failed.log
          head -c 200000 failed.log > failed.trimmed.log

      - name: Diagnose with Claude
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          GITHUB_RUN_URL: ${{ github.event.workflow_run.html_url }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          {
            echo "## 🩺 CI diagnosis"
            echo ""
            python scripts/diagnose_ci.py failed.trimmed.log
          } > diagnosis.md

      - name: Show diagnosis (CI logs)
        run: cat diagnosis.md

      - name: Find PR for this commit
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUM=$(jq -r '.workflow_run.pull_requests[0].number // empty' < "$GITHUB_EVENT_PATH")
          if [ -z "$PR_NUM" ]; then
            PR_NUM=$(gh pr list \
              --repo ${{ github.repository }} \
              --state open \
              --search "${{ github.event.workflow_run.head_sha }}" \
              --json number --jq '.[0].number // empty')
          fi
          echo "number=$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "Resolved PR: ${PR_NUM:-<none>}"

      - name: Upload artifacts for the auto-fix job
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-context
          path: |
            failed.trimmed.log
            diagnosis.md
          retention-days: 1

      - name: Post diagnosis to PR
        if: ${{ steps.pr.outputs.number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ steps.pr.outputs.number }} \
            --repo ${{ github.repository }} \
            --body-file diagnosis.md

      - name: Open issue if no PR
        if: ${{ steps.pr.outputs.number == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo ${{ github.repository }} \
            --title "CI failure on main: $(echo ${{ github.event.workflow_run.head_sha }} | cut -c1-7)" \
            --body-file diagnosis.md

  auto-fix:
    name: Try auto-fix PR
    needs: diagnose
    runs-on: ubuntu-latest
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      !startsWith(github.event.workflow_run.head_branch, 'ai-fix/') &&
      needs.diagnose.outputs.pr_number != ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Download failure context
        uses: actions/download-artifact@v4
        with:
          name: ci-failure-context
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}

      - name: Ask Claude for a patch
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
        run: |
          python scripts/auto_fix_ci.py failed.trimmed.log > fix.patch
          echo "--- patch first 5 lines ---"
          head -5 fix.patch

      - name: Decide if patch is usable
        id: gate
        run: |
          if head -1 fix.patch | grep -q "^NO_AUTOFIX_AVAILABLE"; then
            echo "Claude declined to fix:"
            cat fix.patch
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Allowed paths only: backend/** or frontend/src/**
          bad=$(grep -E "^diff --git " fix.patch \
            | grep -vE "^diff --git a/(backend/|frontend/src/)" || true)
          if [ -n "$bad" ]; then
            echo "Patch touches disallowed paths:"
            echo "$bad"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git apply --check fix.patch; then
            echo "Patch does not apply cleanly"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Apply patch, commit, push fix branch
        if: steps.gate.outputs.ok == 'true'
        id: branch
        env:
          BASE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fix_branch="ai-fix/${BASE_BRANCH//\//-}-${HEAD_SHA:0:7}"
          git checkout -b "$fix_branch"
          git apply fix.patch
          git add -A
          git commit -m "ai: auto-fix attempt for CI failure on ${HEAD_SHA:0:7}"
          git push origin "$fix_branch"
          echo "name=$fix_branch" >> "$GITHUB_OUTPUT"

      - name: Open fix PR
        if: steps.gate.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUM: ${{ needs.diagnose.outputs.pr_number }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          gh pr create \
            --repo ${{ github.repository }} \
            --base "$BASE_BRANCH" \
            --head "${{ steps.branch.outputs.name }}" \
            --title "🤖 AI auto-fix for CI failure on ${HEAD_SHA:0:7}" \
            --body "$(cat <<EOF
          Automated fix attempt by Claude for the CI failure on commit \`${HEAD_SHA:0:7}\`.

          ## What this PR does
          Applies a small unified-diff patch generated by \`scripts/auto_fix_ci.py\`
          based on the failed CI logs.

          ## Patch (committed)
          \`\`\`diff
          $(cat fix.patch | head -c 4000)
          \`\`\`

          ## How to use
          - Review the diff carefully — Claude is wrong sometimes
          - If correct: **squash-merge this PR** into \`$BASE_BRANCH\` and let CI re-run
          - If wrong: close it and the branch will be cleaned up

          Linked PR: #$PR_NUM
          Failed run: $RUN_URL
          EOF
          )"

      - name: Comment on original PR if no auto-fix
        if: steps.gate.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ needs.diagnose.outputs.pr_number }}
        run: |
          gh pr comment "$PR_NUM" \
            --repo ${{ github.repository }} \
            --body "🤖 _Auto-fix declined: patch was unsafe, out of scope, or did not apply cleanly. See diagnosis above._"
