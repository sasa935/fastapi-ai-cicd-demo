name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write
  actions: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude Code review
        uses: anthropics/claude-code-action@v1
        with:
          # Subscription auth via the Claude Code GitHub App.
          # No API key needed — runs against the connected Claude Pro/Max account.
          use_oauth: "true"
          prompt: |
            You are reviewing a pull request for the Shortlink demo
            (FastAPI + Vite/React/TS).

            Focus on:
            - Correctness of new behaviour
            - Security (URL validation, SQLAlchemy ORM only, no shell/SQL injection)
            - Test coverage for new logic
            - Obvious code smells

            Skip nitpicks. Be concise. Use markdown headings + bullets.
            End with a one-line verdict, e.g. "**Verdict:** ship it".
            Reply via `gh pr comment` on the current PR.
          claude_args: "--allowedTools Bash(gh pr comment:*),Bash(gh pr diff:*)"
